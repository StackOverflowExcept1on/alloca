runs:
  using: composite
  steps:
    - name: Install armv7 toolchain
      shell: bash
      run: |
        sudo apt update
        sudo apt install --yes gcc-arm-linux-gnueabi qemu-user

    - name: Configure armv7 toolchain
      shell: bash
      run: |
        echo 'CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABI_LINKER=arm-linux-gnueabi-gcc' >> "$GITHUB_ENV"
        echo 'CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABI_RUNNER=qemu-arm -L /usr/arm-linux-gnueabi' >> "$GITHUB_ENV"
